<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo - Mueblería Hermanos Jota</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">


    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
    <!--header compartido-->
    <header class="header-principal">
        <div class="logo">
            <img src="../assets/img/logo.svg" alt="Mueblería Hermanos Jota">
        </div>

        <button id="btn-menu" class="btn-menu-mobile" aria-label="Abrir menú" aria-expanded="false">
            ☰
        </button>

        <nav id="nav-principal" class="nav-principal">
            <ul>
                <li><a href="../index.html">Inicio</a></li>
                <li><a href="./productos.html">Catálogo</a></li>
                <li><a href="./contacto.html">Contacto</a></li>
            </ul>
        </nav>
        <button id="btn-carrito" class="btn-carrito" aria-label="Ver carrito">
            🛒 <span id="cart-count" class="badge">0</span> 
        </button>

    </header>
    
    <!-- contenido especifico de cada pagina -->
    <main class="contenedor-principal-catalogo">
        <section class="cabecera-catalogo">
            <h1>Catálogo Completo</h1>
            <div class="buscador-container">
                <label for="input-buscador" class="sr-only">Buscar en el catálogo</label>
                <input type="search" id="input-buscador" class="input-buscar" placeholder="Buscar muebles por nombre o catergoría.">
                <button id="btn-buscar" class="btn-buscar" aria-label="Buscar">🔍</button>
            </div>
        </section>

        <section id="grilla-productos" class="grilla-productos">
            <article class="tarjeta-producto">
                <div class="tarjeta-imagen">
                    <img src="../assets/img/Aparador Uspallata.png" alt="Aparador Uspallata">
                    <span class="badge-categoria">Aparadores</span>
                </div>
                <div class="tarjeta-info">
                    <h3 class="producto-titulo">Aparador Uspallata</h3>
                    <p class="producto-precio">$890.000</p>
                    <button class="btn-agregar-carrito" data-id="1">
                        Agregar
                    </button>
                </div>
            </article>

            <article class="tarjeta-producto">
                <div class="tarjeta-imagen">
                    <img src="../assets/img/Biblioteca Recoleta.png" alt="Biblioteca Recoleta">
                    <span class="badge-categoria">Bibliotecas</span>
                </div>
                <div class="tarjeta-info">
                    <h3 class="producto-titulo">Biblioteca Recoleta</h3>
                    <p class="producto-precio">$720.000</p>
                    <button class="btn-agregar-carrito" data-id="2">
                        Agregar
                    </button>
                </div>
            </article>


        </section>
    </main>

    <!-- footer compartido-->
    <footer class="footer-principal">
        <div class="footer-contenido">

            <section class="footer-showroom">
                <h4>SHOWROOM</h4>
                <address>
                    <p> San Cristóbal</p>
                </address>
            </section>
            
            <section class="footer-contacto">
                <h4>CONTACTO</h4>
                <address>
                    <p><a href="https://instagram.com/hermanosjota_ba" target="_blank">@hermanosjota_ba</a></p>
                </address>
            </section>
            
            
        </div>
        <div class="footer-legal">
            <p>&copy; 2026 Mueblería Hermanos Jota. Todos los derechos reservados. Fabricado en Argentina</p>
        </div>
    </footer>

    <!-- archivo js-->
     <script src="../js/data/productos.js"></script>
     <script src="../js/catalogo.js"></script>
</body>
</html>
